<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f5a623" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9b9b9b" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#161616" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- config file -->
  <g transform="translate(640 110)">
    <rect width="320" height="120" rx="16" fill="#2a2a2a" stroke="#f5a623" stroke-opacity="0.6" stroke-width="2" />
    <text x="28" y="50" fill="#f5a623" font-size="26" font-weight="700" font-family="'Geist Mono', 'Courier New', monospace">pipeline.json</text>
    <text x="28" y="86" fill="#9b9b9b" font-size="20">decides which steps run</text>
  </g>
  <path d="M800 230 V 300 M 800 300 H 620 V 360 M 800 300 H 980 V 360" fill="none" stroke="#9b9b9b" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow-dim)" />
  <path d="M620 300 V 360" fill="none" stroke="#9b9b9b" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow-dim)" />

  <!-- sources -->
  <g>
    <rect x="80" y="330" width="300" height="110" rx="16" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="110" y="378" fill="#ececec" font-size="28" font-weight="700">Marketing data</text>
    <text x="110" y="414" fill="#9b9b9b" font-size="20">from many markets</text>
    <rect x="80" y="500" width="300" height="110" rx="16" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="110" y="548" fill="#ececec" font-size="28" font-weight="700">POS data</text>
    <text x="110" y="584" fill="#9b9b9b" font-size="20">what was sold</text>
  </g>
  <path d="M380 385 C 440 385 440 470 480 470" fill="none" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M380 555 C 440 555 440 470 480 470" fill="none" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)" />

  <!-- stages -->
  <g>
    <rect x="490" y="370" width="260" height="200" rx="18" fill="#f5a623" fill-opacity="0.1" stroke="#f5a623" stroke-width="2" />
    <text x="520" y="428" fill="#f5a623" font-size="20" font-weight="700" font-family="'Geist Mono', 'Courier New', monospace">01</text>
    <text x="520" y="472" fill="#ececec" font-size="32" font-weight="800">Standardize</text>
    <text x="520" y="512" fill="#9b9b9b" font-size="20">one consistent format</text>
    <text x="520" y="540" fill="#9b9b9b" font-size="20">for every market</text>
    <rect x="850" y="370" width="260" height="200" rx="18" fill="#f5a623" fill-opacity="0.1" stroke="#f5a623" stroke-width="2" />
    <text x="880" y="428" fill="#f5a623" font-size="20" font-weight="700" font-family="'Geist Mono', 'Courier New', monospace">02</text>
    <text x="880" y="472" fill="#ececec" font-size="32" font-weight="800">Validate</text>
    <text x="880" y="512" fill="#9b9b9b" font-size="20">catch problems before</text>
    <text x="880" y="540" fill="#9b9b9b" font-size="20">they reach a model</text>
  </g>
  <path d="M750 470 H 840" fill="none" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M1110 470 H 1200" fill="none" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)" />

  <!-- destination -->
  <g>
    <rect x="1210" y="400" width="345" height="140" rx="18" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="1240" y="458" fill="#ececec" font-size="28" font-weight="700">Clean, checked data</text>
    <text x="1240" y="496" fill="#9b9b9b" font-size="20">for the ML team</text>
  </g>

  <!-- footer -->
  <text x="800" y="720" text-anchor="middle" fill="#f5a623" font-size="64" font-weight="800">5x faster</text>
  <text x="800" y="770" text-anchor="middle" fill="#9b9b9b" font-size="24">data delivery, rolled out across 30+ countries</text>
</svg>
