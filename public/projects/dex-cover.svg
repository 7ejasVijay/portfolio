<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f5a623" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#161616" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- orderbook panel -->
  <g transform="translate(150 150)">
    <rect width="560" height="600" rx="24" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="36" y="58" fill="#9b9b9b" font-size="20" font-weight="600" letter-spacing="3">ORDERBOOK</text>
    <text x="36" y="104" fill="#9b9b9b" font-size="18" font-family="'Geist Mono', 'Courier New', monospace">PRICE</text>
    <text x="524" y="104" text-anchor="end" fill="#9b9b9b" font-size="18" font-family="'Geist Mono', 'Courier New', monospace">AMOUNT</text>
    <!-- asks -->
    <g font-family="'Geist Mono', 'Courier New', monospace" font-size="22">
      <rect x="250" y="124" width="290" height="40" rx="6" fill="#e5484d" fill-opacity="0.16" />
      <text x="36" y="152" fill="#ff6b6f">4.219</text><text x="524" y="152" text-anchor="end" fill="#ececec">1,204</text>
      <rect x="370" y="172" width="170" height="40" rx="6" fill="#e5484d" fill-opacity="0.16" />
      <text x="36" y="200" fill="#ff6b6f">4.214</text><text x="524" y="200" text-anchor="end" fill="#ececec">863</text>
      <rect x="180" y="220" width="360" height="40" rx="6" fill="#e5484d" fill-opacity="0.16" />
      <text x="36" y="248" fill="#ff6b6f">4.208</text><text x="524" y="248" text-anchor="end" fill="#ececec">2,410</text>
      <rect x="430" y="268" width="110" height="40" rx="6" fill="#e5484d" fill-opacity="0.16" />
      <text x="36" y="296" fill="#ff6b6f">4.203</text><text x="524" y="296" text-anchor="end" fill="#ececec">512</text>
    </g>
    <!-- spread -->
    <line x1="36" y1="324" x2="524" y2="324" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="36" y="364" fill="#ececec" font-size="30" font-weight="800" font-family="'Geist Mono', 'Courier New', monospace">4.201</text>
    <text x="524" y="362" text-anchor="end" fill="#9b9b9b" font-size="18">spread 0.05%</text>
    <line x1="36" y1="384" x2="524" y2="384" stroke="#ffffff" stroke-opacity="0.1" />
    <!-- bids -->
    <g font-family="'Geist Mono', 'Courier New', monospace" font-size="22">
      <rect x="210" y="400" width="330" height="40" rx="6" fill="#2fbf6a" fill-opacity="0.16" />
      <text x="36" y="428" fill="#4ade80">4.198</text><text x="524" y="428" text-anchor="end" fill="#ececec">1,876</text>
      <rect x="380" y="448" width="160" height="40" rx="6" fill="#2fbf6a" fill-opacity="0.16" />
      <text x="36" y="476" fill="#4ade80">4.192</text><text x="524" y="476" text-anchor="end" fill="#ececec">946</text>
      <rect x="150" y="496" width="390" height="40" rx="6" fill="#2fbf6a" fill-opacity="0.16" />
      <text x="36" y="524" fill="#4ade80">4.187</text><text x="524" y="524" text-anchor="end" fill="#ececec">3,020</text>
      <rect x="420" y="544" width="120" height="40" rx="6" fill="#2fbf6a" fill-opacity="0.16" />
      <text x="36" y="572" fill="#4ade80">4.181</text><text x="524" y="572" text-anchor="end" fill="#ececec">624</text>
    </g>
  </g>

  <!-- flow: match, then settle on chain -->
  <path d="M710 450 H 860" fill="none" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)" />
  <g transform="translate(870 330)">
    <rect width="280" height="240" rx="22" fill="#f5a623" fill-opacity="0.1" stroke="#f5a623" stroke-width="2" />
    <text x="140" y="104" text-anchor="middle" fill="#ececec" font-size="34" font-weight="800">Match</text>
    <text x="140" y="146" text-anchor="middle" fill="#9b9b9b" font-size="20">at exchange speed</text>
  </g>
  <path d="M1150 450 H 1260" fill="none" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)" />
  <!-- chain -->
  <g transform="translate(1270 280)" fill="#2a2a2a" stroke="#f5a623" stroke-opacity="0.7" stroke-width="2">
    <rect x="0" y="0" width="190" height="96" rx="14" />
    <rect x="0" y="122" width="190" height="96" rx="14" />
    <rect x="0" y="244" width="190" height="96" rx="14" />
    <path d="M95 96 V122 M95 218 V244" fill="none" />
  </g>
  <g font-family="'Geist Mono', 'Courier New', monospace" font-size="20" fill="#ececec" text-anchor="middle">
    <text x="1365" y="336">block</text><text x="1365" y="458">block</text><text x="1365" y="580">block</text>
  </g>
  <text x="1365" y="660" text-anchor="middle" fill="#9b9b9b" font-size="20">settled on the chain</text>

  <text x="800" y="830" text-anchor="middle" fill="#9b9b9b" font-size="24">A decentralized exchange: a real orderbook, with users keeping their own keys</text>
</svg>
